<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel incident report</title>
</head>
<body style="margin:0;background:#f3f5f7;color:#17212b;font-family:'Segoe UI',sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f5f7;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="640" cellspacing="0" cellpadding="0" style="width:100%;max-width:640px;background:#ffffff;border:1px solid #d8dee4;">
          <tr>
            <td style="padding:24px;border-top:6px solid #0f6cbd;">
              <p style="margin:0 0 8px;font-size:13px;color:#5b6573;">MICROSOFT SENTINEL / WORKSHOP</p>
              <h1 style="margin:0;font-size:24px;font-weight:600;">{{title}}</h1>
              <p style="margin:12px 0 0;font-size:14px;">Incident {{incidentNumber}} | Severity: {{severity}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 24px;">
              <h2 style="font-size:17px;margin:16px 0 8px;">Summary</h2>
              <p style="font-size:14px;line-height:1.6;white-space:pre-wrap;">{{summary}}</p>
              <h2 style="font-size:17px;margin:24px 0 8px;">Next checks</h2>
              <p style="font-size:14px;line-height:1.6;white-space:pre-wrap;">{{nextActions}}</p>
              <p style="margin:24px 0 0;padding-top:16px;border-top:1px solid #d8dee4;font-size:12px;color:#5b6573;">AI-assisted draft. Validate all facts before operational use.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
